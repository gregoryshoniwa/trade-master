name: trademaster

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: tm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trademaster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-trademaster}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-trademaster}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: tm-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.10-alpine
    container_name: tm-nats
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz | grep -q ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  questdb:
    image: questdb/questdb:8.1.1
    container_name: tm-questdb
    restart: unless-stopped
    ports:
      - "9000:9000"    # web console + REST
      - "9009:9009"    # InfluxDB Line Protocol
      - "8812:8812"    # PostgreSQL wire
    volumes:
      - questdb-data:/var/lib/questdb
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000 > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: tm-gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      DERIV_APP_ID: ${DERIV_APP_ID:-1089}
      DERIV_WS_URL: ${DERIV_WS_URL:-wss://ws.derivws.com/websockets/v3}
      DERIV_DEFAULT_SYMBOL: ${DERIV_DEFAULT_SYMBOL:-R_75}
      GATEWAY_PORT: ${GATEWAY_PORT:-8080}
      GATEWAY_LOG_LEVEL: ${GATEWAY_LOG_LEVEL:-info}
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      DATABASE_URL: postgresql://${POSTGRES_USER:-trademaster}:${POSTGRES_PASSWORD:-dev_change_me}@postgres:5432/${POSTGRES_DB:-trademaster}
    # Internal port stays 8080; we expose on 18080 to avoid conflicting with
    # other apps that bind to 8080 on the host.
    ports:
      - "18080:8080"

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: tm-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-trademaster}:${POSTGRES_PASSWORD:-dev_change_me}@postgres:5432/${POSTGRES_DB:-trademaster}
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379/0
      QUESTDB_HTTP_URL: http://questdb:9000
      AUTH_SECRET: ${AUTH_SECRET:-dev_change_me_to_a_long_random_string}
      JWT_ISSUER: ${JWT_ISSUER:-trademaster-local}
      CORS_ORIGINS: "http://localhost:3000"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # mem0's huggingface embedder downloads sentence-transformers/all-MiniLM-L6-v2
      # on first use. Cache it on a volume so subsequent rebuilds skip the download.
      HF_HOME: /cache/hf
      HUGGINGFACE_HUB_CACHE: /cache/hf
      SENTENCE_TRANSFORMERS_HOME: /cache/hf/sentence-transformers
    volumes:
      - hf-cache:/cache/hf
    ports:
      - "8000:8000"

  ttm:
    build:
      context: ./services/models/ttm
      dockerfile: Dockerfile
    container_name: tm-ttm
    restart: unless-stopped
    depends_on:
      nats:
        condition: service_healthy
    environment:
      NATS_URL: nats://nats:4222
      LOG_LEVEL: info
      CONTEXT_LENGTH: 512
      PREDICTION_LENGTH: 96
      FORECAST_EVERY_SECS: 5
    volumes:
      - hf-cache:/cache/hf
    # Internal port stays 8081; exposed on 18081 to avoid host conflicts.
    ports:
      - "18081:8081"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: tm-web
    restart: unless-stopped
    depends_on:
      - gateway
      - api
    environment:
      # Browser-facing URLs — must use host-reachable addresses, not docker
      # service names, because requests are made by the user's browser.
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_DEFAULT_SYMBOL: ${DERIV_DEFAULT_SYMBOL:-R_75}
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  redis-data:
  nats-data:
  questdb-data:
  hf-cache:
