[project]
name = "trademaster-api"
version = "0.1.0"
description = "TradeMaster REST API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "asyncpg>=0.30.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyjwt>=2.10.0",
    "argon2-cffi>=23.1.0",
    "python-slugify>=8.0.4",
    "httpx>=0.27.0",
    # Internal event bus
    "nats-py>=2.9.0",
    # LLM providers
    "anthropic>=0.39.0",
    "google-genai>=0.3.0",
    # Memory layer
    "mem0ai>=0.1.30",
    "psycopg[binary,pool]>=3.2.0",
    "sentence-transformers>=3.3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.uv]
package = false
