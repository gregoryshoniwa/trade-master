[project]
name = "trademaster-model-tsfm"
version = "0.1.0"
description = "TSFM.ai forecasting client — ensemble of Chronos-2 + Moirai-2 via hosted API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "nats-py>=2.9.0",
    "websockets>=13.0",
    "httpx>=0.27.0",
    "asyncpg>=0.30.0",
    "numpy>=1.26.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.uv]
package = false
