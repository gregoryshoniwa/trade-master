[project]
name = "trademaster-model-kronos"
version = "0.1.0"
description = "Kronos forecaster — NeoQuasar Kronos-base K-line foundation model"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "nats-py>=2.9.0",
    "websockets>=13.0",
    # Backtest runs persist directly into the api's backtest_runs table so
    # they survive api restarts (see app/main.py /backtest).
    "asyncpg>=0.30.0",
    # ── Kronos model-code deps (from the repo's requirements.txt) ──
    # On linux/arm64 (M1 Docker) and macOS, torch is CPU-only by default.
    "torch>=2.5.0,<2.7",
    "einops==0.8.1",
    "huggingface-hub==0.33.1",
    "pandas==2.2.2",
    "numpy>=1.26.0,<3.0",
    "safetensors==0.6.2",
    "tqdm==4.67.1",
]

[dependency-groups]
dev = [
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.uv]
package = false
